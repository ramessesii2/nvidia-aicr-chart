# Ten seconds of proof that the stack made the GPUs usable.
#
#   kubectl apply -f hack/demo/manifests/gpu-check-job.yaml
#   kubectl logs -n gpu-bench -f job/gpu-check
#
# The point is `nvidia.com/gpu: 2` in resources. A pod that REQUESTS the GPUs
# and gets scheduled proves the whole allocation path -- device plugin
# advertising them, scheduler accounting for them, kubelet injecting them.
# `kubectl exec` into a GPU Operator pod would show the same hardware while
# proving none of that, because those pods get devices by privilege.
#
# No benchmark on purpose: this demo makes no performance claim, and a
# bandwidth table invites questions that are off-message.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-check
  namespace: gpu-bench
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smi
          # Already cached on the node from the nccl run -- starts instantly.
          image: nvcr.io/nvidia/cuda:12.6.3-runtime-ubuntu22.04
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=index,name,memory.total,driver_version \
                --format=csv
              echo
              nvidia-smi topo -m | head -5
          resources:
            limits:
              nvidia.com/gpu: 2
